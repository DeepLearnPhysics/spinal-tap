name: Docker Image

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name == 'release' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: deeplearnphysics/spinal-tap

jobs:
  checks:
    if: github.event_name != 'release' || !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml

  validate:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3 pytest
      - name: Validate release version and notes
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            version=$(python scripts/render_release.py validate --tag "$RELEASE_TAG")
          else
            version=$(python -c 'import runpy; print(runpy.run_path("src/spinal_tap/version.py")["__version__"])')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m pytest test/test_release.py -q

  build-and-push:
    name: Build ${{ matrix.variant }} Docker image
    needs: [checks, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lean
            dockerfile: docker/Dockerfile
            suffix: ''
          - variant: larcv
            dockerfile: docker/Dockerfile.larcv
            suffix: '-larcv'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.3
      - name: Log in to the Container registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=raw,value=latest,enable=${{ matrix.variant == 'lean' && github.event_name == 'release' }}
            type=raw,value=larcv,enable=${{ matrix.variant == 'larcv' && github.event_name == 'release' }}
      - name: Build the exact image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            spinal-tap:ci-${{ matrix.variant }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke-test the image before publication
        env:
          FLAVOR: ${{ matrix.variant }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/smoke_container.py "spinal-tap:ci-$FLAVOR" --version "$VERSION" --flavor "$FLAVOR"
      - name: Push tested image and render immutable S3DF bundle
        if: github.event_name == 'release'
        env:
          METADATA: ${{ steps.meta.outputs.json }}
          FLAVOR: ${{ matrix.variant }}
        run: |
          for tag in $(printf '%s' "$METADATA" | jq -r '.tags[]'); do
            docker push "$tag"
          done
          digest_ref=$(docker image inspect "spinal-tap:ci-$FLAVOR" --format '{{index .RepoDigests 0}}')
          python scripts/render_release.py render --image "$digest_ref" --flavor "$FLAVOR" --output "_build/s3df-release-$FLAVOR"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: s3df-release-${{ matrix.variant }}
          path: _build/s3df-release-${{ matrix.variant }}
      - uses: fluxcd/flux2/action@v2.9.6
        if: github.event_name == 'release'
        with:
          version: '2.9.6'
      - name: Publish versioned deployment bundle
        if: github.event_name == 'release'
        env:
          REVISION: ${{ github.sha }}
          RELEASE: ${{ github.event.release.tag_name }}
          FLAVOR: ${{ matrix.variant }}
        run: |
          flux push artifact "oci://ghcr.io/deeplearnphysics/spinal-tap-deploy:$RELEASE-$FLAVOR" \
            --path="_build/s3df-release-$FLAVOR" \
            --source=https://github.com/DeepLearnPhysics/spinal-tap \
            --revision="$RELEASE@sha1:$REVISION"
      - name: Promote only the latest stable release
        if: github.event_name == 'release'
        env:
          RELEASE: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          FLAVOR: ${{ matrix.variant }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api repos/DeepLearnPhysics/spinal-tap/releases/latest --jq .id)
          if [ "$latest" = "$RELEASE_ID" ]; then
            flux tag artifact "oci://ghcr.io/deeplearnphysics/spinal-tap-deploy:$RELEASE-$FLAVOR" --tag "release-$FLAVOR"
          else
            echo "Another release is latest; leave the deployment channel unchanged."
          fi

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'release'
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: spinal-tap
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'true'
