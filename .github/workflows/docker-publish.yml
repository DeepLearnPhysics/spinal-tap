name: Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build ${{ matrix.variant }} Docker image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lean
            dockerfile: docker/Dockerfile
            suffix: ''
          - variant: larcv
            dockerfile: docker/Dockerfile.larcv
            suffix: '-larcv'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        flavor: |
          # Semver sources otherwise generate :latest implicitly for every
          # matrix variant. Moving tags are assigned explicitly below.
          latest=false
        tags: |
          # For PRs, just tag with pr-number (don't push)
          type=ref,event=pr,suffix=${{ matrix.suffix }}
          # Lean: 1.2.0, 1.2, latest. LArCV: 1.2.0-larcv, 1.2-larcv, larcv.
          type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
          type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
          type=raw,value=latest,enable=${{ matrix.variant == 'lean' && startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=larcv,enable=${{ matrix.variant == 'larcv' && startsWith(github.ref, 'refs/tags/v') }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      packages: write

    steps:
    - name: Delete old untagged images
      uses: actions/delete-package-versions@v5
      with:
        package-name: 'spinal-tap'
        package-type: 'container'
        min-versions-to-keep: 5
        delete-only-untagged-versions: 'true'
