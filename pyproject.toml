[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spinal-tap"
dynamic = ["version"]
description = "SPINE Reconstruction Visualization Tool"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "DeepLearnPhysics Collaboration", email = "drielsma@stanford.edu"}
]
maintainers = [
    {name = "Francois Drielsma", email = "drielsma@stanford.edu"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization"
]
keywords = [
    "event display",
    "neutrino",
    "particle imaging",
    "physics",
    "scientific visualization",
    "WebGL"
]
dependencies = [
    "spine[viz]>=1.0.1",
    "dash>=4.4.0",
    "flask>=2.0.0",
    "flask-session>=0.5.0",
    "anywidget"
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/DeepLearnPhysics/spinal-tap"
Repository = "https://github.com/DeepLearnPhysics/spinal-tap.git"
Documentation = "https://spinal-tap.readthedocs.io/"
"Bug Tracker" = "https://github.com/DeepLearnPhysics/spinal-tap/issues"

[project.scripts]
spinal-tap = "spinal_tap.app:main"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "pre-commit",
    "pytest",
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spinal_tap = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "spinal_tap.version.__version__"}

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["spinal_tap"]
known_third_party = ["spine"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["test"]

[tool.coverage.run]
source = ["src/spinal_tap"]
omit = [
    "*/test/*",
    "*/tests/*",
    "setup.py",
]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
